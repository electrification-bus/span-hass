name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  hassfest:
    name: Hassfest (Home Assistant manifest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  spec-drift:
    name: Spec drift (pinned catalogs vs upstream)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: electrification-bus/specification
          ref: main
          path: _spec
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Fails (exit 1) when .ebus-spec.json is BEHIND the current upstream spec:
      # the signal to re-vendor the catalogs (scripts/sync_spec.py). The daily
      # cron catches upstream version bumps even with no local commits.
      - name: Report drift of .ebus-spec.json against current spec
        run: |
          python3 _spec/tools/drift-report.py \
            --manifest _spec/spec-manifest.json \
            "${GITHUB_WORKSPACE}/.ebus-spec.json"

  version-consistency:
    name: Version consistency (manifest vs CHANGELOG)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The manifest version and the newest released CHANGELOG heading must move
      # together, so a "Release vX" that forgot to bump one of them fails CI
      # instead of shipping a mismatch (the .github/workflows/release.yml tag
      # guard then relies on this invariant).
      - name: manifest.json version must match the newest CHANGELOG entry
        run: |
          MANIFEST_VER=$(python3 -c "import json; print(json.load(open('custom_components/span_ebus/manifest.json'))['version'])")
          TOP_VER=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          echo "manifest=$MANIFEST_VER  changelog-newest=${TOP_VER:-none}"
          if [ -z "${TOP_VER:-}" ]; then
            echo "::error::No released '## [x.y.z]' entry found in CHANGELOG.md."
            exit 1
          fi
          if [ "$MANIFEST_VER" != "$TOP_VER" ]; then
            echo "::error::manifest.json version ($MANIFEST_VER) != newest CHANGELOG entry ([$TOP_VER]). Add a CHANGELOG entry for $MANIFEST_VER (or adjust the manifest) so they agree."
            exit 1
          fi
