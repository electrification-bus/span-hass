name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  hassfest:
    name: Hassfest (Home Assistant manifest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  spec-drift:
    name: Spec drift (pinned catalogs vs upstream)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: electrification-bus/specification
          ref: main
          path: _spec
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Fails (exit 1) when .ebus-spec.json is BEHIND the current upstream spec:
      # the signal to re-vendor the catalogs (scripts/sync_spec.py). The daily
      # cron catches upstream version bumps even with no local commits.
      - name: Report drift of .ebus-spec.json against current spec
        run: |
          python3 _spec/tools/drift-report.py \
            --manifest _spec/spec-manifest.json \
            "${GITHUB_WORKSPACE}/.ebus-spec.json"

  quality:
    name: Quality (${{ matrix.ha }} HA)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "pinned" is the locked set, so the suite exercises the ebus-sdk and
        # Home Assistant versions a user actually gets rather than a floor
        # nobody resolves to. "minimum" is whatever hacs.json declares, which
        # HACS enforces at install time: without this leg a change could rely
        # on a newer Home Assistant API and break every user on the floor
        # while every check here stayed green.
        ha: [pinned, minimum]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install (locked set)
        if: matrix.ha == 'pinned'
        run: |
          pipx install poetry
          poetry install --no-interaction

      # Deliberately not Poetry: the lock file pins Home Assistant, and
      # downgrading inside that environment fights the resolver. Every version
      # here is derived from a file rather than typed in, so this leg cannot
      # drift from what a HACS user actually installs: the Home Assistant floor
      # comes from hacs.json, the runtime requirements from manifest.json
      # (exactly what Home Assistant pip-installs for the integration), and the
      # mypy version from poetry.lock so the two legs type-check identically.
      # The requirements file is written rather than interpolated so nothing
      # depends on word splitting, and printed so the log shows what ran.
      - name: Install (declared minimum)
        if: matrix.ha == 'minimum'
        run: |
          python - > min-requirements.txt <<'EOF'
          import json, tomllib
          floor = json.load(open("hacs.json"))["homeassistant"]
          lock = tomllib.load(open("poetry.lock", "rb"))
          mypy = next(p["version"] for p in lock["package"] if p["name"] == "mypy")
          print(f"homeassistant=={floor}")
          print(f"homeassistant-stubs=={floor}")
          print(f"mypy=={mypy}")
          print("pytest-homeassistant-custom-component")
          print("pytest")
          print("pytest-asyncio")
          for req in json.load(open("custom_components/span_ebus/manifest.json"))["requirements"]:
              print(req)
          EOF
          cat min-requirements.txt
          python -m pip install --upgrade pip
          python -m pip install -r min-requirements.txt
          python -c "import homeassistant.const as c; print('testing against HA', c.__version__)"

      - name: Tests
        run: ${{ matrix.ha == 'pinned' && 'poetry run pytest tests/ -q' || 'pytest tests/ -q' }}

      # Types runs on BOTH legs, and on the minimum leg it is the stronger of
      # the two floor checks: the device-registry tests mock the registry, so
      # they pass against a Home Assistant that lacks the methods entirely,
      # whereas mypy against that release's stubs reports every call site.
      - name: Types
        run: ${{ matrix.ha == 'pinned' && 'poetry run mypy custom_components/span_ebus/' || 'mypy custom_components/span_ebus/' }}

      # Lint describes the code as written, not as it runs, so once is enough.
      - name: Lint
        if: matrix.ha == 'pinned'
        run: poetry run ruff check custom_components/span_ebus/ tests/

  version-consistency:
    name: Version consistency (manifest vs CHANGELOG)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The manifest version and the newest released CHANGELOG heading must move
      # together, so a "Release vX" that forgot to bump one of them fails CI
      # instead of shipping a mismatch (the .github/workflows/release.yml tag
      # guard then relies on this invariant).
      - name: manifest.json version must match the newest CHANGELOG entry
        run: |
          MANIFEST_VER=$(python3 -c "import json; print(json.load(open('custom_components/span_ebus/manifest.json'))['version'])")
          TOP_VER=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          echo "manifest=$MANIFEST_VER  changelog-newest=${TOP_VER:-none}"
          if [ -z "${TOP_VER:-}" ]; then
            echo "::error::No released '## [x.y.z]' entry found in CHANGELOG.md."
            exit 1
          fi
          if [ "$MANIFEST_VER" != "$TOP_VER" ]; then
            echo "::error::manifest.json version ($MANIFEST_VER) != newest CHANGELOG entry ([$TOP_VER]). Add a CHANGELOG entry for $MANIFEST_VER (or adjust the manifest) so they agree."
            exit 1
          fi
